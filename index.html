<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MediFlow | Pharmacy POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"><a class="brand" href="#"><span>+</span>MediFlow</a><nav><p>WORKSPACE</p><a class="active">▦ Point of sale</a><a>□ Products</a><a>◷ Orders</a><a>♙ Customers</a><p>MANAGEMENT</p><a>◫ Inventory</a><a>↗ Reports</a><a>⚙ Settings</a></nav><div class="help"><b>Need assistance?</b><br>Contact your pharmacy manager.</div></aside>
    <main><header><div><small>Wednesday, 26 August</small><h1>Good morning, Nadia</h1></div><div class="profile"><button>♧</button><i>NA</i></div></header>
      <div class="layout"><section><div class="tools"><label>⌕<input id="search" placeholder="Search medicine, category or barcode..."></label><button class="primary">+ Add product</button></div><div class="categories" id="categories"></div><div class="product-grid" id="products"></div></section>
      <section class="cart"><div class="cart-title"><h2>Current sale</h2><em id="count">0 items</em></div><div id="cart-items" class="cart-items"></div><div class="summary"><div><span>Subtotal</span><span id="subtotal">$0.00</span></div><div><span>Tax (5%)</span><span id="tax">$0.00</span></div><div class="total"><b>Total</b><b id="total">$0.00</b></div><button id="pay" disabled>Complete payment →</button><p>Secure pharmacy checkout</p></div></section></div>
    </main>
  </div><div id="toast"></div><script src="app.js"></script>
</body></html>
