 <button class="nav active">🛒 کاشێر</button>
<button class="nav">📦 کۆگا</button>
<button class="nav">💰 فرۆشتن</button>
<button class="nav">👥 کڕیارەکان</button>
<button class="nav">📊 ڕاپۆرت</button>
<button class="nav">⚙️ ڕێکخستن</button>
<header class="header">
  <div>
    <h1>سیستەمی کاشێر</h1>
    <p>PLEX Company System</p>
  </div>

  <button class="primary" onclick="openProductModal()">
    ＋ زیادکردنی کاڵا
  </button>
</header>

<section class="stats">

  <div class="stat">
    <span>💰</span>
    <div>
      <small>فرۆشتنی ئەمڕۆ</small>
      <b id="todaySales">0 IQD</b>
    </div>
  </div>

  <div class="stat">
    <span>📦</span>
    <div>
      <small>ژمارەی کاڵاکان</small>
      <b id="productCount">0</b>
    </div>
  </div>

  <div class="stat">
    <span>🛒</span>
    <div>
      <small>کاڵای سەبەت</small>
      <b id="cartCount">0</b>
    </div>
  </div>

  <div class="stat">
    <span>📈</span>
    <div>
      <small>قازانج</small>
      <b id="profit">0 IQD</b>
    </div>
  </div>

</section>

<section class="content">

  <div class="products panel">

    <div class="toolbar">

      <input
        id="search"
        placeholder="🔍 گەڕان بە ناوی کاڵا..."
        oninput="renderProducts()">

      <button onclick="openProductModal()" class="primary">
        ＋ کاڵای نوێ
      </button>

    </div>

    <div id="productsGrid" class="products-grid"></div>

  </div>


  <aside class="cart panel">

    <div class="cart-header">
      <h2>🛒 سەبەت</h2>

      <button onclick="clearCart()" class="danger-small">
        سڕینەوە
      </button>
    </div>

    <div id="cartItems"></div>

    <div class="checkout">

      <div class="total">
        <span>کۆی گشتی</span>
        <b id="total">0 IQD</b>
      </div>

      <label>
        پارەی وەرگیراو
        <input
          id="paid"
          type="number"
          placeholder="0"
          oninput="calculateChange()">
      </label>

      <div class="change">
        <span>گۆڕانەوە</span>
        <b id="change">0 IQD</b>
      </div>

      <button
        class="complete"
        onclick="completeSale()">

        ✓ تەواوکردنی فرۆشتن

      </button>

      <button
        class="print"
        onclick="printReceipt()">

        🖨 چاپکردنی پسوڵە

      </button>

    </div>

  </aside>

</section>
<div class="modal-title">

  <h2 id="modalTitle">
    زیادکردنی کاڵا
  </h2>

  <button onclick="closeProductModal()">×</button>

</div>

<input id="productId" type="hidden">

<label>
  ناوی کاڵا
  <input id="productName" placeholder="ناوی کاڵا">
</label>

<label>
  نرخ
  <input id="productPrice" type="number" placeholder="25000">
</label>

<label>
  ژمارەی کۆگا
  <input id="productStock" type="number" placeholder="50">
</label>

<label>
  ئایکۆن
  <input id="productIcon" value="📦">
</label>

<div class="modal-buttons">

  <button
    class="cancel"
    onclick="closeProductModal()">

    پاشگەزبوونەوە

  </button>

  <button
    class="primary"
    onclick="saveProduct()">

    حەفظکردن

  </button>

</div>
